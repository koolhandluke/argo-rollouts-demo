on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

defaults:
  run:
    shell: bash

jobs:
  describe:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: The-PR-Agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_KEY }}
          CONFIG__FALLBACK_MODELS: "[]"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"

  risk-assessment:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Load instructions
        run: |
          { echo 'INSTRUCTIONS<<EOF'; cat .pr_agent/risk-instructions.md; echo 'EOF'; } >> $GITHUB_ENV
      - uses: The-PR-Agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_KEY }}
          CONFIG__FALLBACK_MODELS: "[]"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER__INLINE_CODE_COMMENTS: "false"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: ${{ env.INSTRUCTIONS }}

  test-coverage:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Load instructions
        run: |
          { echo 'INSTRUCTIONS<<EOF'; cat .pr_agent/test-instructions.md; echo 'EOF'; } >> $GITHUB_ENV
      - uses: The-PR-Agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_KEY }}
          CONFIG__FALLBACK_MODELS: "[]"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "false"
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "true"
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER__INLINE_CODE_COMMENTS: "false"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: ${{ env.INSTRUCTIONS }}

  code-quality:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Load instructions
        run: |
          { echo 'INSTRUCTIONS<<EOF'; cat .pr_agent/quality-instructions.md; echo 'EOF'; } >> $GITHUB_ENV
      - uses: The-PR-Agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_KEY }}
          CONFIG__FALLBACK_MODELS: "[]"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "false"
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER__REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER__INLINE_CODE_COMMENTS: "true"
          PR_REVIEWER__NUM_CODE_SUGGESTIONS: "5"
          PR_REVIEWER__EXTRA_INSTRUCTIONS: ${{ env.INSTRUCTIONS }}
