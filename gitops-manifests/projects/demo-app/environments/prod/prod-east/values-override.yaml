# gitops-manifests/projects/demo-app/environments/prod/cluster-us-east/values-override.yaml
# Static cluster-specific config. Never edited during promotion.
replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

ingress:
  host: demo-app.prod.us-east.example.com

env:
  AWS_REGION: "us-east-1"
